<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Хронометр — MeMo</title>
<meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a2622" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Хронометр">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data:; connect-src 'self' https://sheets.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<style>
@font-face{font-family:"Onest";src:url("fonts/onest.woff") format("woff");font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:"Prata";src:url("fonts/prata.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
/* MeMo финансы: «Бумага» (светлая) и «Чернила» (тёмная). Одна колонка до 880px; прямые углы, без теней, уровни — цветом поверхности и волосяной линией. Латунная итоговая черта — одна на экран, под цифрой таймера. */
:root{
  --bg:#f4f5f1; --bg-raised:#e4e8e3; --field:#ffffff; --text:#1c2321; --text-muted:#56625e;
  --brand:#0f3a33; --accent:#8a6a2b; --action:#0f3a33; --on-action:#f4f5f1;
  --line:#c9d0ca; --line-soft:#d9ded9; --focus:#8a6a2b; --hover:#d7ddd7;
  --bad:#9b3b30; --good:#2f5a50;
  --font-display:"Prata","Georgia","Times New Roman",serif;
  --font-text:"Onest","Helvetica Neue",Arial,sans-serif;
  --rule-hair:1px; --rule-total:1.5px; --rule-total-gap:4px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0a2622; --bg-raised:#12332d; --field:#0d2c27; --text:#f4f5f1; --text-muted:#a9b7b1;
  --brand:#f4f5f1; --accent:#cfae67; --action:#cfae67; --on-action:#0a2622;
  --line:#2a4a43; --line-soft:#1d3f38; --focus:#cfae67; --hover:#18403a;
  --bad:#e0907f; --good:#9fb0a8;
  color-scheme:dark } }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font:16px/1.6 var(--font-text);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--text);text-underline-offset:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
h2{font:400 26px/1.2 var(--font-display);color:var(--brand)}
h3{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-muted);line-height:1.4}
p{margin:0}
ol{margin:0;padding-left:20px;display:grid;gap:6px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:var(--rule-hair) solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--brand);min-width:0}
.brand img{display:block;height:42px;width:auto}
.brand .sep{width:var(--rule-hair);align-self:stretch;background:var(--line)}
.brand .app{font:400 20px/1 var(--font-display);color:var(--brand);white-space:nowrap}
.brand .logo-dark{display:none}
@media (prefers-color-scheme: dark){ .brand .logo-light{display:none} .brand .logo-dark{display:block} }
nav.tabs{display:flex;gap:22px;margin-left:auto}
nav.tabs a{padding:6px 0;color:var(--text-muted);text-decoration:none;font-weight:500;font-size:15px;border-bottom:var(--rule-hair) solid transparent}
nav.tabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--text)}
@media (max-width:560px){ .brand .sep,.brand .app{display:none} .brand img{height:36px} nav.tabs{gap:16px} }

main{padding-block:40px 96px;display:grid;gap:40px}
.card{background:var(--bg-raised);padding:24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
@media (max-width:560px){ main{padding-block:24px 80px;gap:24px} .card{padding:20px} }

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:2px;border:var(--rule-hair) solid var(--text);background:transparent;color:var(--text);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;color:var(--text-muted);text-decoration:underline;text-underline-offset:4px;padding:0 6px;font-weight:500}
.btn.ghost:hover{color:var(--text);background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.ghost.sm{padding:0 4px}
.btn.big{min-height:56px;padding:0 32px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:36px;height:36px;border-radius:2px;border:var(--rule-hair) solid transparent;background:transparent;color:var(--text-muted);display:inline-grid;place-items:center;font-size:16px;line-height:1}
.iconbtn:hover{border-color:var(--line);color:var(--text)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:20px;height:20px}

/* fields */
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:12px;color:var(--text-muted);font-weight:600;letter-spacing:.02em}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:2px;border:var(--rule-hair) solid var(--line);background:var(--field);color:var(--text)}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--text);outline:none}
.err{font-size:13px;color:var(--bad);font-weight:500}
.err:empty{display:none}

/* timer */
.timer{display:grid;gap:24px;padding:32px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.picks{grid-template-columns:1fr}.timer{padding:20px;gap:20px}}
.figure{display:grid;gap:8px;justify-items:start}
.bigclock{font:400 clamp(56px,13vw,104px)/1 var(--font-display);letter-spacing:-.02em;color:var(--brand);display:flex}
.bigclock .dg{display:inline-block;width:.62em;text-align:center}
.bigclock .cl{display:inline-block;width:.3em;text-align:center}
.bigclock.idle{color:var(--text-muted);opacity:.55}
.rule-total{height:calc(var(--rule-total) * 2 + var(--rule-total-gap));border-top:var(--rule-total) solid var(--accent);border-bottom:var(--rule-total) solid var(--accent);width:100%}
.since{font-size:13px;color:var(--text-muted);font-weight:500}
.clockrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.runlabel{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;min-width:0}
.runlabel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--text-muted));flex:none}
.timer.running{box-shadow:inset 3px 0 0 var(--c,var(--brand))}
.empty{display:grid;gap:16px;padding:32px}
.empty p{color:var(--text-muted);max-width:60ch}
.banner{border-top:var(--rule-hair) solid var(--line);border-bottom:var(--rule-hair) solid var(--line);padding:14px 0;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1;min-width:220px}

/* journal */
.journal{display:grid;gap:28px}
.day{display:grid;gap:0}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 0 8px;border-bottom:var(--rule-hair) solid var(--line)}
.dayhead b{font-weight:600}
.dayhead .num{font-weight:600}
.entry{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:14px;align-items:start;width:100%;text-align:left;padding:12px 0;border:0;border-bottom:var(--rule-hair) solid var(--line-soft);background:transparent;line-height:1.45}
.entry:hover{background:linear-gradient(var(--hover),var(--hover)) no-repeat;background-size:100% 100%;box-shadow:-8px 0 0 var(--hover),8px 0 0 var(--hover)}
.entry .t{font-size:14px;color:var(--text-muted);font-variant-numeric:tabular-nums;padding-top:1px}
.entry .what{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.entry .what span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .proj{color:var(--text-muted);font-weight:400}
.entry .cm{font-size:14px;color:var(--text-muted);padding-left:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .d{font-size:14px;font-variant-numeric:tabular-nums;color:var(--text-muted);padding-top:1px;white-space:nowrap}
.entry.live .d{color:var(--text);font-weight:600}
@media (max-width:560px){
  .entry{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t d" "m m";gap:2px 10px}
  .entry .t{grid-area:t}
  .entry .d{grid-area:d}
  .entry .m{grid-area:m}
  .li{gap:2px}
  .li .iconbtn{width:30px}
  .li .arch-label{display:none}
}
@media (min-width:561px){ .li .arch-icon{display:none} }

/* dictionary */
.lead{font-size:16px;color:var(--text-muted);max-width:62ch}
.dict{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;align-items:start}
.dict .card{display:grid;gap:16px}
.list{display:grid;gap:8px}
.li{display:flex;gap:6px;align-items:center;min-width:0}
.li input[type=text]{flex:1;min-width:0}
.swatch{width:32px;height:32px;border-radius:50%;border:0;background:var(--c);flex:none}
.swatch:hover{outline:var(--rule-hair) solid var(--text);outline-offset:3px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
details.arch{border-top:var(--rule-hair) solid var(--line);padding-top:14px}
details.arch summary{cursor:pointer;color:var(--text-muted);font-size:14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.arch summary::-webkit-details-marker{display:none}
details.arch summary::before{content:"";flex:none;width:7px;height:7px;margin-left:2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.arch[open] summary::before{transform:rotate(45deg)}
details.arch .list{margin-top:10px}
.li.archived .name{flex:1;min-width:0;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:14px;color:var(--text-muted)}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.palette button{aspect-ratio:1;border-radius:50%;border:0;background:var(--c);max-width:100%;outline-offset:3px}
.palette button[aria-pressed="true"]{outline:2px solid var(--text)}
.sect{display:grid;gap:12px;padding-top:20px;border-top:var(--rule-hair) solid var(--line)}
.sect:first-child{border-top:0;padding-top:0}
code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--bg-raised);padding:1px 5px;border-radius:2px;word-break:break-all}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,38,34,.5);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--bg);border:var(--rule-hair) solid var(--line);width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:28px;display:grid;gap:20px}
.modal header{display:flex;align-items:center;gap:10px}
.modal header h2{flex:1;font-size:24px}
.modal .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modal .actions .sp{flex:1}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}.modal{padding:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--brand);color:var(--bg);padding:12px 16px;border-radius:2px;display:flex;gap:16px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:0;color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---- bottom navigation on phones ---- */
nav.bottom{display:none}
@media (max-width:640px){
  nav.tabs{display:none}
  #btn-settings{margin-left:auto}
  nav.bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:var(--rule-hair) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  nav.bottom a{display:grid;justify-items:center;gap:3px;padding:10px 4px 9px;font-size:12px;color:var(--text-muted);text-decoration:none;font-weight:500}
  nav.bottom a svg{width:22px;height:22px}
  nav.bottom a[aria-current="page"]{color:var(--text)}
  main{padding-bottom:110px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
/* ---- reports ---- */
.stack{display:grid;gap:32px}
.seg{display:inline-flex;border:var(--rule-hair) solid var(--line);border-radius:2px}
.seg button{border:0;background:transparent;padding:8px 14px;color:var(--text-muted);font-weight:500;font-size:14px;min-height:40px}
.seg button+button{border-left:var(--rule-hair) solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.toolbar .dates{display:flex;gap:8px;align-items:center}
.toolbar .dates input{width:150px}
@media (max-width:560px){.seg{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.seg button{padding:8px 4px;font-size:13px}.toolbar>.field{width:100%}.toolbar .dates{width:100%}.toolbar .dates input{width:auto;flex:1;min-width:0}}
.hero{display:grid;gap:10px;justify-items:start}
.hero .fig{font:400 clamp(64px,12vw,112px)/1 var(--font-display);color:var(--brand);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .fig small{font-size:.32em;letter-spacing:0;margin-left:.2em;color:var(--text-muted)}
.hero .rule-total{width:min(100%,420px)}
.hero .cap{font-size:14px;color:var(--text-muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;margin-top:8px;width:100%}
.kpi{display:grid;gap:2px;border-top:var(--rule-hair) solid var(--line);padding-top:10px}
.kpi .v{font:400 30px/1.1 var(--font-display);color:var(--brand);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--text-muted);font-weight:500}
:root{--chart-main:#0f3a33;--chart-dim:#9fb0a8;--chart-hl:#2f5a50}
@media (prefers-color-scheme: dark){:root{--chart-main:#9fb0a8;--chart-dim:#2f5a50;--chart-hl:#f4f5f1}}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--chart-main);pointer-events:none}
.chart .bar.hl{fill:var(--chart-hl)}
.chart .gridl{stroke:var(--line-soft);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--text-muted);font:500 11px var(--font-text)}
.chart text.today{fill:var(--text);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 10px;border-radius:2px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
.tip b{font-weight:600}
.hbars{display:grid;gap:14px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;grid-template-areas:"nm h pc" "tr tr tr";gap:5px 12px;align-items:center;font-size:14px}
.hrow .nm{grid-area:nm;display:flex;align-items:center;gap:8px;min-width:0}
.hrow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .track{grid-area:tr;height:10px;background:var(--line-soft)}
.hrow .track i{display:block;height:100%;background:var(--chart-main)}
.hrow .h{grid-area:h;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hrow .pc{grid-area:pc;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-muted)}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;align-items:start}
.rep-grid .card,.card.stack18{display:grid;gap:18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--text-muted);font-weight:600;padding:8px 8px 8px 0;border-bottom:var(--rule-hair) solid var(--line)}
table.t td{padding:9px 8px 9px 0;border-bottom:var(--rule-hair) solid var(--line-soft)}
table.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.pr td{font-weight:600}
table.t tr.sub td:first-child{padding-left:18px;color:var(--text-muted)}
.scroll-x{overflow-x:auto}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#track" aria-label="MeMo финансы — Хронометр"><img class="logo-light" src="logo-light.svg" alt="MeMo финансы"><img class="logo-dark" src="logo-dark.svg" alt="MeMo финансы"><span class="sep" aria-hidden="true"></span><span class="app">хронометр</span></a>
  <nav class="tabs" aria-label="Разделы">
    <a href="#track" data-tab="track">Учёт</a>
    <a href="#reports" data-tab="reports">Отчёты</a>
    <a href="#dict" data-tab="dict">Справочник</a>
  </nav>
  <button class="iconbtn" id="btn-settings" aria-label="Данные и выгрузка" title="Данные и выгрузка">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6M5 12v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6"/></svg>
  </button>
</div></header>
<main class="wrap" id="main"></main>
<nav class="bottom" aria-label="Разделы">
  <a href="#track" data-tab="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2.5h4"/></svg>Учёт</a>
  <a href="#reports" data-tab="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Отчёты</a>
  <a href="#dict" data-tab="dict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Справочник</a>
</nav>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="app.js"></script>
</body>
</html>
